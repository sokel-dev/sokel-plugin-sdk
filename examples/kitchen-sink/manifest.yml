# yaml-language-server: $schema=https://raw.githubusercontent.com/sokel-dev/sokel-plugin-sdk/main/docs/sokel.schema.json
# Kitchen sink — one declaration that uses **every contract shape**.
#
# It is three things at once:
#   1. A syntax reference: every field shape and every optional capability appears exactly once.
#   2. The input to the consistency suite: python/ and node/ each implement it, and both must report
#      a contract equal to the same golden file.
#   3. A starting point for a new plugin: delete the parts you do not need.
#
# Generate: sokel-gen generate ./examples/kitchen-sink
# Check:    sokel-gen check ./examples/kitchen-sink   (for CI; red if this file changed and nothing
#           was regenerated)

plugin:
  org: sokel
  name: kitchen-sink
  label: Kitchen sink
  desc: A reference plugin covering every field shape, files, streaming, events, webhooks and collaborative auth
  version: 1.0.0
  doc: docs/kitchen-sink.md

# Optional capability self-report: `operations` says whether an operation exists, this says how far
# it goes. The webhook bit needs no entry here — registering a handler is the declaration, and the
# SDK merges it in.
capabilities:
  recency: false

credential:
  # Collaborative authentication: this kind of credential cannot be typed in (the user has to type a
  # code back). The panel's "log in" button starts a flow the plugin drives.
  # The steps follow from `kind`: input = start + poll + submit.
  auth:
    kind: input
  fields:
    - name: api_key
      label: API key
      type: secret          # secret = masked in storage and in the UI
      required: true
    - name: base_url
      label: Service URL
      type: string
      default: https://api.example.com
    - name: region
      label: Region
      type: enum
      options:
        - { value: cn, label: China }
        - { value: sg, label: Singapore }
      default: cn

events_common: [chat_id]     # every event carries it; flattened to the top level on trigger

events:
  - id: message
    label: Message received
    desc: One message picked up by a webhook or a long poll
    fields:
      - { name: chat_id, label: Chat ID, type: string, required: true }
      - { name: text, label: Text, type: string }
      - { name: attachment, label: Attachment, type: file }
  - id: heartbeat
    label: Heartbeat
    desc: A liveness signal from the event source, to prove the "plugin pushes, platform starts a run" path works
    fields:
      - { name: chat_id, label: Chat ID, type: string, required: true }
      - { name: at, label: Timestamp, type: string, required: true }

operations:
  - id: echo_all
    label: Echo every shape
    desc: One field of every shape, echoed back — what you declare is what the runtime value looks like.
    inputs:
      - { name: text, label: Text, type: string, required: true }
      - { name: note, label: Note, type: text, desc: Multi-line text; it differs from string only in the UI control }
      - { name: count, label: Count, type: int, default: 1 }
      - { name: ratio, label: Ratio, type: number, default: 0.5 }
      - { name: flag, label: Flag, type: boolean, default: true }
      - name: mode
        label: Mode
        type: enum
        # Both spellings work: a bare string when the value reads fine, or {value,label} when the
        # value is a code no human reads.
        options:
          - { value: fast, label: Fast (one fewer upstream call) }
          - { value: full, label: "Full (slower, more complete)" }
        default: fast
      - { name: tags, label: Tags, type: strings }
      - name: profile
        label: Profile
        type: json
        goType: Profile       # name the structure: referenced twice, generated once
        fields:
          - { name: name, label: Name, type: string, required: true }
          - { name: age, label: Age, type: int }
          - name: address
            label: Address
            type: json
            fields:
              - { name: city, label: City, type: string }
              - { name: zip, label: ZIP, type: string }
      - name: points
        label: Points
        type: array
        goType: Point
        fields:
          - { name: x, label: X, type: number, required: true }
          - { name: y, label: Y, type: number, required: true }
      - name: labels
        label: Dynamic labels
        type: json
        desc: Keys known only at runtime, values all one type
        valueType: { name: value, type: string }
      - name: extra
        label: Passthrough
        type: json
        opaque: true
        desc: Passed through from the caller; the shape is decided upstream — a reason is mandatory before opaque is allowed
      - name: doc
        label: Document
        type: json
        desc: Structural union — one of these shapes, and the runtime value is that branch (no discriminator wrapper)
        oneOf:
          - name: DocObject
            label: Document object
            type: json
            fields:
              - { name: title, label: Title, type: string, required: true }
              - { name: body, label: Body, type: text }
          - name: Block
            label: Block array
            type: array
            fields:
              - { name: kind, label: Kind, type: string, required: true }
              - { name: content, label: Content, type: string }
    outputs:
      - { name: text, label: Text, type: string, required: true }
      - { name: count, label: Count, type: int, required: true }
      - { name: mode, label: Mode, type: string, required: true }
      - { name: tags, label: Tags, type: strings }
      - { name: profile, label: Profile, type: json, goType: Profile }
      - { name: points, label: Points, type: array, goType: Point }
      - { name: labels, label: Dynamic labels, type: json, valueType: { name: value, type: string } }
      - { name: summary, label: Summary, type: text, required: true }

  - id: health_check
    label: Credential check
    desc: >-
      The reserved id the platform calls from the credential page's "Test" button and from
      "check credentials" in a workflow. It takes no input. An unusable credential must come back as
      **ok=false**, not as an error — an error leaves the platform able to say only "the call failed",
      not whether the key expired or the network is down. A plugin without this operation can only
      discover a stale credential through a real call.
    inputs: []
    outputs:
      - { name: ok, label: Usable, type: boolean, required: true }
      - { name: message, label: Detail, type: string, desc: Say why when it is unusable; may be empty when it is fine }

  - id: file_digest
    label: File digest
    desc: A file input, fetched lazily; a file output, handed back to the platform. Only references travel through the canvas.
    timeoutSec: 120           # heavy work declares its own timeout: the platform default of 60s would cut this short
    inputs:
      - { name: file, label: File, type: file, required: true }
      - { name: extras, label: Extra files, type: files, desc: A file list has exactly one spelling — array<file> }
    outputs:
      - { name: name, label: File name, type: string, required: true }
      - { name: sha256, label: Digest, type: string, required: true }
      - { name: size, label: Bytes, type: int, required: true }
      - { name: extra_count, label: Extra file count, type: int, required: true }
      - { name: report, label: Report file, type: file }

  - id: chat_stream
    label: Streaming reply
    desc: "A streaming operation: text frames for a human to watch, then typed variables for downstream nodes."
    stream: true
    inputs:
      - { name: prompt, label: Prompt, type: string, required: true }
      - { name: chunks, label: Frames, type: int, default: 3 }
    outputs:
      - { name: reply, label: Reply, type: text, required: true }
      - { name: frames, label: Frame count, type: int, required: true }

# One declaration renders typed shells for two languages — the reference implementations follow the
# **same file**, not two copies drifting apart.
codegen:
  - { lang: python, out: python/sokel_gen.py }
  - { lang: ts, out: node/src/sokel.gen.ts }

# —— implements：平台能力接口 ——
# 操作长在能力里，所以两个能力可以各有一个叫 query 的槽位而不撞（线上 id 分别是
# rowstore.query 与 vectorstore.query）。普通集成插件整段不写。
implements:
  - capability: rowstore
    operations:
      - id: query
        label: Row query
        inputs:
          - { name: table, type: string, required: true }
          - { name: filter, type: json }
        outputs:
          - { name: rows, type: json }

  - capability: vectorstore
    operations:
      - id: query
        label: Vector search
        inputs:
          - { name: kb_id, type: string, required: true }
          - { name: embedding, type: array, itemType: number, required: true }
          - { name: k, type: int, required: true }
        outputs:
          - { name: hits, type: json }

  # 从属能力：据实报关键词腿是 n-gram 近似而非 BM25。
  # 同父的 vectorstore/keyword_bm25 若也来填 keyword_query，注册期会报冲突。
  - capability: vectorstore/keyword_ngram
    operations:
      - id: keyword_query
        label: Keyword search
        inputs:
          - { name: kb_id, type: string, required: true }
          - { name: query, type: string, required: true }
        outputs:
          - { name: hits, type: json }
