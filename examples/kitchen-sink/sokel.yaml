# yaml-language-server: $schema=https://raw.githubusercontent.com/sokel-dev/sokel-plugin-sdk/main/docs/sokel.schema.json
# Kitchen sink —— 一份**覆盖全部契约形态**的插件声明。
#
# 它同时是三件东西：
#   1. 语法参考：每种字段形态、每种可选能力都在这里出现一次；
#   2. 一致性套件的输入：python/ 与 node/ 各实现一遍，两边上报的契约必须等于同一份 golden；
#   3. 新插件的起点：删掉用不上的部分即可。
#
# 生成：sokel-gen generate ./examples/kitchen-sink
# 校验：sokel-gen check ./examples/kitchen-sink   （CI 用；改了本文件忘了重新生成会红）

plugin:
  name: kitchen-sink
  label: 全能示例
  desc: 覆盖全部字段形态、文件、流式、事件、webhook 与协作式认证的参考插件
  version: 1.0.0
  doc: docs/kitchen-sink.md

# 可选能力自报：「操作有没有」看 operations，「某个操作做到什么程度」看这里。
# webhook 这一位不用写——注册了处理器就是支持，SDK 自动并入。
capabilities:
  recency: false

credential:
  # 协作式认证：这类凭证没法让人填（要回填验证码），面板点「登录」后由插件出题。
  # 步骤由 kind 定死：input = start + poll + submit。
  auth:
    kind: input
  fields:
    - name: api_key
      label: API Key
      type: secret          # secret = 脱敏存储与展示
      required: true
    - name: base_url
      label: 服务地址
      type: string
      default: https://api.example.com
    - name: region
      label: 区域
      type: enum
      options:
        - { value: cn, label: 中国大陆 }
        - { value: sg, label: 新加坡 }
      default: cn

events_common: [chat_id]     # 每个事件都有；平台触发时平铺到输入顶层（{{节点.chat_id}}）

events:
  - id: message
    label: 收到消息
    desc: 上游 webhook 或长轮询拿到的一条消息
    fields:
      - { name: chat_id, label: 会话 ID, type: string, required: true }
      - { name: text, label: 文本, type: string }
      - { name: attachment, label: 附件, type: file }
  - id: heartbeat
    label: 心跳
    desc: 事件源存活信号，用来验证「插件推、平台起流」这条链路
    fields:
      - { name: chat_id, label: 会话 ID, type: string, required: true }
      - { name: at, label: 时刻, type: string, required: true }

operations:
  - id: echo_all
    label: 回显全部形态
    desc: 每种字段形态各一份，原样回显——契约怎么声明、运行值就长什么样。
    inputs:
      - { name: text, label: 文本, type: string, required: true }
      - { name: note, label: 备注, type: text, desc: 多行文本；与 string 的区别只在 UI 控件 }
      - { name: count, label: 次数, type: int, default: 1 }
      - { name: ratio, label: 比例, type: number, default: 0.5 }
      - { name: flag, label: 开关, type: boolean, default: true }
      - name: mode
        label: 模式
        type: enum
        # 两种写法都行：裸字符串（值本身可读），或 {value,label}（值是代码、人看不懂时）
        options:
          - { value: fast, label: 快（少调一次上游） }
          - { value: full, label: 全（更慢但更全） }
        default: fast
      - { name: tags, label: 标签, type: strings }
      - name: profile
        label: 档案
        type: json
        goType: Profile       # 给结构一个名字：多处引用只生成一个类型
        fields:
          - { name: name, label: 姓名, type: string, required: true }
          - { name: age, label: 年龄, type: int }
          - name: address
            label: 地址
            type: json
            fields:
              - { name: city, label: 城市, type: string }
              - { name: zip, label: 邮编, type: string }
      - name: points
        label: 坐标集
        type: array
        goType: Point
        fields:
          - { name: x, label: X, type: number, required: true }
          - { name: y, label: Y, type: number, required: true }
      - name: labels
        label: 动态标签
        type: json
        desc: 键运行期才知道、值类型统一
        valueType: { name: value, type: string }
      - name: extra
        label: 透传
        type: json
        opaque: true
        desc: 调用方透传，形状由上游决定——无结构必须写清理由，否则不允许标 opaque
      - name: doc
        label: 文档
        type: json
        desc: 结构联合：三种形状之一，运行值就是该分支本身（不带 discriminator 包装）
        oneOf:
          - name: DocObject
            label: 文档对象
            type: json
            fields:
              - { name: title, label: 标题, type: string, required: true }
              - { name: body, label: 正文, type: text }
          - name: Block
            label: 块数组
            type: array
            fields:
              - { name: kind, label: 类型, type: string, required: true }
              - { name: content, label: 内容, type: string }
    outputs:
      - { name: text, label: 文本, type: string, required: true }
      - { name: count, label: 次数, type: int, required: true }
      - { name: mode, label: 模式, type: string, required: true }
      - { name: tags, label: 标签, type: strings }
      - { name: profile, label: 档案, type: json, goType: Profile }
      - { name: points, label: 坐标集, type: array, goType: Point }
      - { name: labels, label: 动态标签, type: json, valueType: { name: value, type: string } }
      - { name: summary, label: 摘要, type: text, required: true }

  - id: health_check
    label: 凭证体检
    desc: >-
      平台约定的保留 id：凭证页的「测试」与工作流的「检查凭证」都调它，不带入参。
      凭证不可用要**返回 ok=false**，不是报错——报错的话平台只能说「调用失败」，
      说不出是密钥过期还是网络不通。没声明这个操作的插件，凭证只能靠实际调用来发现失效。
    inputs: []
    outputs:
      - { name: ok, label: 可用, type: boolean, required: true }
      - { name: message, label: 说明, type: string, desc: 不可用时说清原因（人话），可用时可留空 }

  - id: file_digest
    label: 文件摘要
    desc: 文件入参 → 惰性取字节；产出文件 → 字节交回平台登记，画布里只流转引用。
    timeoutSec: 120           # 重活自报超时：平台默认 60s，用户拖出节点时并不知道该填多少
    inputs:
      - { name: file, label: 文件, type: file, required: true }
      - { name: extras, label: 附加文件, type: files, desc: 数量位只有 array<file> 这一种表达 }
    outputs:
      - { name: name, label: 文件名, type: string, required: true }
      - { name: sha256, label: 摘要, type: string, required: true }
      - { name: size, label: 字节数, type: int, required: true }
      - { name: extra_count, label: 附加文件数, type: int, required: true }
      - { name: report, label: 报告文件, type: file }

  - id: chat_stream
    label: 流式回话
    desc: 流式操作：逐帧产出文本给人看，末尾产出类型化变量给下游。
    stream: true
    inputs:
      - { name: prompt, label: 提示词, type: string, required: true }
      - { name: chunks, label: 分几帧, type: int, default: 3 }
    outputs:
      - { name: reply, label: 回复, type: text, required: true }
      - { name: frames, label: 帧数, type: int, required: true }

# 同一份声明生成两种语言的类型化外壳——参考实现照着的是**同一个文件**，
# 不是两份抄来抄去的副本。
codegen:
  - { lang: python, out: python/sokel_gen.py }
  - { lang: ts, out: node/src/sokel.gen.ts }
