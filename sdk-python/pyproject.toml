[project]
name = "sokel-plugin-sdk"
version = "0.3.0"
description = "Sokel plugin SDK for Python — declare the contract in sokel.yaml, implement typed handlers."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["sokel", "plugin", "sdk", "nats", "workflow", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "nats-py>=2.6.0",
    "pydantic>=2.5.0",
]

[project.urls]
Homepage = "https://github.com/sokel-dev/sokel-plugin-sdk"
Source = "https://github.com/sokel-dev/sokel-plugin-sdk/tree/main/sdk-python"
Issues = "https://github.com/sokel-dev/sokel-plugin-sdk/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sokel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
