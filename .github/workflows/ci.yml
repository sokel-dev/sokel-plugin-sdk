# SDK 的 CI：三种语言各一份，外加一条 codegen 新鲜度。
#
# codegen 那条守的是 SDK 特有的失效方式：sokel-gen 改了输出格式，
# 但仓库里的示例生成物还是旧的——照样编译得过，只有重新生成才看得出来。
#
# python / node 两个 job 跑的是**同一个参考插件**的一致性套件：三种语言上报的契约
# 必须等于同一份 golden。没有它，各 SDK 对协议的理解会各自漂，而漂了不会有任何症状。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25', cache-dependency-path: go.sum }

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "::error::以下文件未格式化："; echo "$out"; exit 1; fi

      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -timeout 10m ./...

      # 重跑 codegen，工作区必须依旧干净。用 sokel-gen 自己的 check——
      # 按 schema/ 目录发现插件，不靠 //go:generate 指令（漏写指令会被静默跳过）。
      - name: codegen 新鲜度
        run: |
          go run ./cmd/sokel-gen check ./examples
          go run ./cmd/sokel-gen generate ./examples
          git diff --exit-code || {
            echo "::error::重跑 sokel-gen 后工作区变脏——生成物已过期"
            git diff --stat
            exit 1
          }

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 装 SDK
        run: pip install -e './sdk-python[dev]'
      - name: 测试（含 kitchen-sink 契约 == golden）
        run: python -m pytest -q
        working-directory: sdk-python

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: SDK 测试
        run: npm install --no-package-lock && npm test
        working-directory: sdk-node
      - name: 参考插件（契约 == golden）
        run: npm install --no-package-lock && npm test
        working-directory: examples/kitchen-sink/node
