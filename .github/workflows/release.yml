# Release: **one tag ships three SDKs** (Go, Python, Node) at the same version.
#
# Why they are tied together: all three implement the same wire protocol version, and their
# consistency is held in place by the golden file in examples/kitchen-sink. Versioning them
# separately would turn "which versions go together" into something a person has to remember — and
# nobody does, until the day their behaviour disagrees.
#
# Go needs none of this pipeline: the module sits at the repository root, `go get` resolves it by tag,
# and **pushing the tag is the release**. So this covers npm and PyPI only, plus the gates that run
# before anything goes out.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rehearse with (e.g. 0.2.0); nothing is actually published'
        required: true

permissions:
  contents: read

jobs:
  # The gate: do the versions agree, is the generated code current, do all three test suites pass?
  # Only then may anything go out — neither npm nor PyPI **can delete a version**, so a bad release
  # can only be covered up by another one.
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # Deliberately the newest toolchain, not the 1.23 floor from go.mod: the compiler checks stdlib
      # symbols against the `go` directive, so building here with 1.25 still rejects a 1.24-only API
      # ("requires go1.24 or later (file is go1.23)"). Pinning this to 1.23 would test less, not more.
      - uses: actions/setup-go@v5
        with: { go-version: '1.25', cache-dependency-path: go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Resolve the version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ inputs.version }}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "releasing $v"

      # The version is written in three places (the tag, package.json, pyproject.toml). A mismatch
      # stops the run: once a package ships under a version that disagrees with its tag, there is no
      # way left to trace that package back to a commit.
      - name: Versions agree
        run: |
          v="${{ steps.v.outputs.version }}"
          npm_v=$(node -p "require('./sdk-node/package.json').version")
          py_v=$(grep -m1 '^version = ' sdk-python/pyproject.toml | cut -d'"' -f2)
          fail=0
          [ "$npm_v" = "$v" ] || { echo "::error::sdk-node/package.json says $npm_v, the tag says $v"; fail=1; }
          [ "$py_v" = "$v" ]  || { echo "::error::sdk-python/pyproject.toml says $py_v, the tag says $v"; fail=1; }
          # Those three places are the only ones allowed. A fourth copy hard-coded inside the package
          # would let the distribution metadata and sokel.__version__ disagree — which is exactly how
          # 0.2.0 shipped carrying __version__ = "0.1.0".
          # The 0.0.0+local fallback is excluded: it is what an uninstalled source tree reports, not a
          # real version. The first cut of this gate counted it too, which would have failed every
          # release.
          if grep -rnE '__version__[[:space:]]*=[[:space:]]*"[0-9]' sdk-python/sokel/ | grep -v '0\.0\.0+local'; then
            echo "::error::the sokel package hard-codes a version — read it from importlib.metadata instead"
            fail=1
          fi
          exit $fail

      - name: Go tests and generated-code freshness
        run: |
          gofmt -l . | tee /tmp/fmt && [ ! -s /tmp/fmt ]
          go vet ./...
          go test -race ./...
          go run ./cmd/sokel-gen check ./examples

      - name: Node SDK tests
        working-directory: sdk-node
        run: npm install --no-package-lock && npm test

      - name: Python SDK tests
        run: |
          pip install -e './sdk-python[dev]'
          python -m pytest -q sdk-python

      - name: Reference plugin contract == golden (Node side)
        working-directory: examples/kitchen-sink/node
        run: npm install --no-package-lock && npm test

      # Look inside the package before it goes out: dist/ is not in version control, so forgetting to
      # build produces an **empty package** — which still "installs successfully" and only blows up on
      # import.
      - name: Package contents
        run: |
          (cd sdk-node && npm pack --dry-run 2>&1 | tee /tmp/npm-pack.txt)
          grep -q 'dist/src/index.js' /tmp/npm-pack.txt || { echo "::error::the npm package has no dist/src/index.js"; exit 1; }
          pip install build twine
          python -m build sdk-python
          twine check sdk-python/dist/*
          # The sdist must contain the implementation: with the wrong packages setting in pyproject it
          # installs as an empty shell, `pip install` succeeds, and only import sokel fails.
          tar tzf sdk-python/dist/*.tar.gz | grep -q 'sokel/plugin.py' \
            || { echo "::error::the sdist has no sokel/plugin.py"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: sdk-python/dist/

  publish-npm:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC: both npm's trusted publishing and the provenance attestation use it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', registry-url: 'https://registry.npmjs.org' }
      # Trusted publishing needs npm >= 11.5.1, and the npm bundled with Node 22 is older. Without
      # this the publish falls back to looking for a token and fails with a 401 — a confusing way to
      # learn the npm version is the problem.
      - run: npm install -g npm@latest
      - working-directory: sdk-node
        run: npm install --no-package-lock
      - name: Publish to npm
        working-directory: sdk-node
        # No token: the package has a trusted publisher configured, so npm authenticates over OIDC and
        # attaches provenance by itself. `npm publish` is the same command either way.
        run: npm publish

  publish-pypi:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # PyPI trusted publishing (OIDC): no long-lived token of any kind
    steps:
      - uses: actions/download-artifact@v4
        with: { name: python-dist, path: dist }
      # Publishes the very files verify built — rebuilding could produce a package other than the one
      # just checked
      - uses: pypa/gh-action-pypi-publish@release/v1
